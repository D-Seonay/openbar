services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bardenoa
      POSTGRES_PASSWORD: bardenoa
      POSTGRES_DB: bardenoa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bardenoa -d bardenoa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bardenoa:bardenoa@postgres:5432/bardenoa
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: http://web:3000
      # The API owns the Discord secret: the web container never sees it.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
    volumes:
      - uploads_data:/app/uploads
    # No published port: the browser never calls the API directly. Uploaded
    # images reach it through the web service's /uploads rewrite, so the API
    # stays on the internal network.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEST_API_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      # Public values only — used to build the authorize redirect.
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}
    ports:
      - "8080:3000"

volumes:
  postgres_data:
  uploads_data:

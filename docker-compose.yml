services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bardenoa
      POSTGRES_PASSWORD: bardenoa
      POSTGRES_DB: bardenoa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bardenoa -d bardenoa"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://bardenoa:bardenoa@postgres:5432/bardenoa
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: http://web:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEST_API_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:3000"

volumes:
  postgres_data:
